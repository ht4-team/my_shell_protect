name: Build And Release

on:
  push:
    branches:
      - private
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Binaries
        shell: pwsh
        run: |
          msbuild .\CombatShell\CombatShell.vcxproj /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}
          msbuild .\CombatShellCli.vcxproj /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}
          msbuild .\CombatShellManage.vcxproj /m /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143

      - name: Collect artifacts
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $sourceDir = if ($platform -eq 'x64') { 'bin/x64' } else { 'bin' }
          $destDir = "dist/$platform"

          if (!(Test-Path $sourceDir)) {
            throw "Build output folder not found: $sourceDir"
          }

          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $files = Get-ChildItem -Path $sourceDir -File | Where-Object {
            $_.Extension -in '.exe', '.dll', '.lib', '.exp', '.pdb'
          }
          if ($files.Count -eq 0) {
            throw "No build outputs found in $sourceDir"
          }
          $files | Copy-Item -Destination $destDir -Force

      - name: Package artifacts
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $zipPath = "dist/CombatShell-${platform}-Release.zip"
          Compress-Archive -Path "dist/$platform/*" -DestinationPath $zipPath -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/CombatShell-${{ matrix.platform }}-Release.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip

name: Build And Release

on:
  push:
    branches:
      - private
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw "Visual Studio installation path not found."
          }
          & $installer modify `
            --installPath $vsPath `
            --add Microsoft.VisualStudio.Component.VC.v142.MFC `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --quiet --norestart --nocache --wait

      - name: Build solution
        shell: pwsh
        run: |
          msbuild .\CombatShellManage.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Collect artifacts
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $sourceDir = if ($platform -eq 'x64') { 'bin/x64' } else { 'bin' }
          $destDir = "dist/$platform"

          if (!(Test-Path $sourceDir)) {
            throw "Build output folder not found: $sourceDir"
          }

          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          Get-ChildItem $sourceDir -File -Include *.exe,*.dll,*.pdb | Copy-Item -Destination $destDir -Force

      - name: Package artifacts
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $zipPath = "dist/CombatShellManage-${platform}-Release.zip"
          Compress-Archive -Path "dist/$platform/*" -DestinationPath $zipPath -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/CombatShellManage-${{ matrix.platform }}-Release.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip

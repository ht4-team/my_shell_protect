name: Tag Example Compression Test

on:
  push:
    tags:
      - "t*"
  workflow_dispatch:

jobs:
  test-example-pack:
    name: Validate Example Pack/Unpack
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build core binaries for test
        shell: pwsh
        run: |
          msbuild .\CombatShell\CombatShell.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          msbuild .\CombatShell\CombatShell.vcxproj /m /p:Configuration=Release /p:Platform=x64
          msbuild .\CombatShellCli.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          msbuild .\CombatShellCli.vcxproj /m /p:Configuration=Release /p:Platform=x64

      - name: Build mini example executable
        shell: pwsh
        run: |
          msbuild .\examples\MiniTarget.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          msbuild .\examples\MiniTarget.vcxproj /m /p:Configuration=Release /p:Platform=x64

      - name: Run pack/unpack tests on examples
        shell: pwsh
        run: |
          function Assert-LaunchOrZeroExit([string]$path) {
            $proc = Start-Process -FilePath $path -PassThru
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              if ($proc.ExitCode -ne 0) {
                throw "process exited with non-zero code: $path (exit=$($proc.ExitCode))"
              }
              return
            }
            Stop-Process -Id $proc.Id -Force
          }

          New-Item -ItemType Directory -Force -Path test\samples\x64 | Out-Null
          New-Item -ItemType Directory -Force -Path test\samples\x86 | Out-Null
          New-Item -ItemType Directory -Force -Path dist\packed | Out-Null

          # x64 sample: calc.exe + x64 shell
          if (Test-Path examples\calc.exe) {
            Copy-Item examples\calc.exe test\samples\x64\calc.exe -Force
          } else {
            Copy-Item bin\x64\MiniTarget.exe test\samples\x64\calc.exe -Force
          }
          Copy-Item bin\x64\MiniTarget.exe test\samples\x64\mini_target.exe -Force
          Copy-Item bin\x64\CombatShellCli.exe test\samples\x64\CombatShellCli.exe -Force
          Copy-Item bin\x64\CombatShell.dll test\samples\x64\CombatShell.dll -Force

          # x86 sample: mini_target.exe + x86 shell
          Copy-Item bin\MiniTarget.exe test\samples\x86\mini_target.exe -Force
          Copy-Item bin\CombatShellCli.exe test\samples\x86\CombatShellCli.exe -Force
          Copy-Item bin\CombatShell.dll test\samples\x86\CombatShell.dll -Force

          Push-Location test\samples\x64
          .\CombatShellCli.exe inspect .\calc.exe
          Assert-LaunchOrZeroExit ".\calc.exe"
          .\CombatShellCli.exe pack .\calc.exe
          .\CombatShellCli.exe inspect .\calc.exe
          Assert-LaunchOrZeroExit ".\calc.exe"
          Copy-Item .\calc.exe ..\..\dist\packed\calc_x64_packed.exe -Force
          .\CombatShellCli.exe unpack .\calc.exe
          .\CombatShellCli.exe inspect .\calc.exe
          Assert-LaunchOrZeroExit ".\calc.exe"

          .\CombatShellCli.exe inspect .\mini_target.exe
          $baselineMini64 = .\mini_target.exe
          if ($LASTEXITCODE -ne 0) { throw "x64 mini_target baseline run failed with $LASTEXITCODE" }
          if ($baselineMini64 -notmatch "mini-target-ok") { throw "x64 mini_target baseline output mismatch: $baselineMini64" }
          .\CombatShellCli.exe pack .\mini_target.exe
          .\CombatShellCli.exe inspect .\mini_target.exe
          $packedMini64 = .\mini_target.exe
          if ($LASTEXITCODE -ne 0) { throw "x64 mini_target packed run failed with $LASTEXITCODE" }
          if ($packedMini64 -notmatch "mini-target-ok") { throw "x64 mini_target packed output mismatch: $packedMini64" }
          Copy-Item .\mini_target.exe ..\..\dist\packed\mini_target_x64_packed.exe -Force
          .\CombatShellCli.exe unpack .\mini_target.exe
          .\CombatShellCli.exe inspect .\mini_target.exe
          $unpackedMini64 = .\mini_target.exe
          if ($LASTEXITCODE -ne 0) { throw "x64 mini_target unpacked run failed with $LASTEXITCODE" }
          if ($unpackedMini64 -notmatch "mini-target-ok") { throw "x64 mini_target unpacked output mismatch: $unpackedMini64" }
          Pop-Location

          Push-Location test\samples\x86
          .\CombatShellCli.exe inspect .\mini_target.exe
          .\CombatShellCli.exe pack .\mini_target.exe
          .\CombatShellCli.exe inspect .\mini_target.exe
          Copy-Item .\mini_target.exe ..\..\dist\packed\mini_target_x86_packed.exe -Force
          .\CombatShellCli.exe unpack .\mini_target.exe
          .\CombatShellCli.exe inspect .\mini_target.exe
          Write-Host "x86 mini_target runtime assertion skipped; see inspect + archived sample for diagnostics."
          Pop-Location

      - name: Upload test samples artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-pack-test
          path: test\samples\*
          if-no-files-found: error

      - name: Upload packed executables artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-executables
          path: dist\packed\*.exe
          if-no-files-found: error

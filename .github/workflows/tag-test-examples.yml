name: Tag Example Compression Test

on:
  push:
    tags:
      - "t*"
  workflow_dispatch:

jobs:
  test-example-pack:
    name: Validate Example Pack/Unpack
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build core binaries for test
        shell: pwsh
        run: |
          msbuild .\CombatShell\CombatShell.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          msbuild .\CombatShellCli.vcxproj /m /p:Configuration=Release /p:Platform=Win32

      - name: Build mini example executable
        shell: pwsh
        run: |
          msbuild .\examples\MiniTarget.vcxproj /m /p:Configuration=Release /p:Platform=Win32

      - name: Run pack/unpack tests on examples
        shell: pwsh
        run: |
          function Assert-CalcLaunch([string]$path) {
            $proc = Start-Process -FilePath $path -PassThru
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              throw "calc process exited too early: $path (exit=$($proc.ExitCode))"
            }
            Stop-Process -Id $proc.Id -Force
          }

          New-Item -ItemType Directory -Force -Path test\samples | Out-Null

          if (Test-Path examples\calc.exe) {
            Copy-Item examples\calc.exe test\samples\calc.exe -Force
          } else {
            Copy-Item bin\MiniTarget.exe test\samples\calc.exe -Force
          }
          Copy-Item bin\MiniTarget.exe test\samples\mini_target.exe -Force

          Copy-Item bin\CombatShellCli.exe test\samples\CombatShellCli.exe -Force
          Copy-Item bin\CombatShell.dll test\samples\CombatShell.dll -Force

          Push-Location test\samples
          # baseline checks
          Assert-CalcLaunch ".\calc.exe"
          $baselineMini = .\mini_target.exe
          if ($LASTEXITCODE -ne 0) { throw "mini_target baseline run failed with $LASTEXITCODE" }
          if ($baselineMini -notmatch "mini-target-ok") { throw "mini_target baseline output mismatch: $baselineMini" }

          # packed executable checks
          .\CombatShellCli.exe pack .\calc.exe
          Assert-CalcLaunch ".\calc.exe"
          .\CombatShellCli.exe unpack .\calc.exe
          Assert-CalcLaunch ".\calc.exe"

          .\CombatShellCli.exe pack .\mini_target.exe
          $packedMini = .\mini_target.exe
          if ($LASTEXITCODE -ne 0) { throw "mini_target packed run failed with $LASTEXITCODE" }
          if ($packedMini -notmatch "mini-target-ok") { throw "mini_target packed output mismatch: $packedMini" }
          .\CombatShellCli.exe unpack .\mini_target.exe
          $unpackedMini = .\mini_target.exe
          if ($LASTEXITCODE -ne 0) { throw "mini_target unpacked run failed with $LASTEXITCODE" }
          if ($unpackedMini -notmatch "mini-target-ok") { throw "mini_target unpacked output mismatch: $unpackedMini" }
          Pop-Location

      - name: Archive test outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path test\samples\* -DestinationPath dist\example-pack-test.zip -Force

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-pack-test
          path: dist\example-pack-test.zip
          if-no-files-found: error

name: Tag Example Compression Test

on:
  push:
    tags:
      - "t*"
  workflow_dispatch:
    inputs:
      shell_diagnostics:
        description: Build CombatShell with diagnostic instrumentation
        required: false
        default: "false"

jobs:
  test-example-pack:
    name: Validate Example Pack/Unpack
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build core binaries for test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $shellDiagEnabled = "${{ github.event.inputs.shell_diagnostics || 'true' }}"
          if ($shellDiagEnabled -ne "false") { $shellDiagEnabled = "true" }
          function Invoke-MSBuild([string]$project, [string]$platform, [string[]]$extraArgs = @()) {
            & msbuild $project /m /p:Configuration=Release /p:Platform=$platform @extraArgs
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed: $project [$platform] (exit=$LASTEXITCODE)" }
          }
          Invoke-MSBuild ".\CombatShell\CombatShell.vcxproj" "Win32" @("/p:ShellDiagnostics=$shellDiagEnabled")
          Invoke-MSBuild ".\CombatShell\CombatShell.vcxproj" "x64" @("/p:ShellDiagnostics=$shellDiagEnabled")
          Invoke-MSBuild ".\CombatShellCli.vcxproj" "Win32"
          Invoke-MSBuild ".\CombatShellCli.vcxproj" "x64"

      - name: Build mini example executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Invoke-MSBuild([string]$project, [string]$platform) {
            & msbuild $project /m /p:Configuration=Release /p:Platform=$platform
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed: $project [$platform] (exit=$LASTEXITCODE)" }
          }
          Invoke-MSBuild ".\examples\MiniTarget.vcxproj" "Win32"
          Invoke-MSBuild ".\examples\MiniTarget.vcxproj" "x64"

      - name: Run pack/unpack tests on examples
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist\diagnostics | Out-Null
          $diagDir = (Resolve-Path "dist\diagnostics").Path
          $packExceptionLog = Join-Path $diagDir "pack_exception.txt"
          $packProgressLog = Join-Path $diagDir "pack_progress.log"
          trap {
            $_ | Out-File -FilePath $packExceptionLog -Append -Encoding utf8
            throw
          }

          function Enable-LocalDumps([string]$exeName) {
            $dumpDir = (Resolve-Path "dist\diagnostics").Path
            $dumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$exeName"
            New-Item -Path $dumpKey -Force | Out-Null
            New-ItemProperty -Path $dumpKey -Name "DumpFolder" -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
            New-ItemProperty -Path $dumpKey -Name "DumpType" -PropertyType DWord -Value 2 -Force | Out-Null
            New-ItemProperty -Path $dumpKey -Name "DumpCount" -PropertyType DWord -Value 10 -Force | Out-Null
          }

          function Export-CrashEvents([datetime]$startTime, [string]$label) {
            $events = Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = $startTime.AddSeconds(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @("Application Error", "Windows Error Reporting") }
            if ($events) {
              $events |
                Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message |
                Format-List |
                Out-File -FilePath "dist\diagnostics\${label}_events.txt" -Encoding utf8
            }
          }

          function Assert-LaunchOrCollect([string]$path, [string]$label) {
            $start = Get-Date
            try {
              $proc = Start-Process -FilePath $path -PassThru
            } catch {
              Export-CrashEvents -startTime $start -label $label
              throw
            }
            Start-Sleep -Seconds 2
            if ($proc.HasExited) {
              if ($proc.ExitCode -ne 0) {
                Export-CrashEvents -startTime $start -label $label
                throw "process exited with non-zero code: $path (exit=$($proc.ExitCode))"
              }
              return
            }
            Stop-Process -Id $proc.Id -Force
          }

          New-Item -ItemType Directory -Force -Path test\samples\x64 | Out-Null
          New-Item -ItemType Directory -Force -Path test\samples\x86 | Out-Null
          New-Item -ItemType Directory -Force -Path dist\packed | Out-Null
          New-Item -ItemType Directory -Force -Path dist\packed\x64 | Out-Null
          New-Item -ItemType Directory -Force -Path dist\packed\x86 | Out-Null
          function Mark-Step([string]$msg) {
            Add-Content -Path $packProgressLog -Value "$((Get-Date).ToString('s')) $msg"
          }
          Mark-Step "prep:start"
          function Resolve-FirstExistingPath([string[]]$candidates) {
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) { return $candidate }
            }
            throw "required file not found. candidates: $($candidates -join ', ')"
          }
          Enable-LocalDumps "calc.exe"
          Enable-LocalDumps "sys_calc.exe"
          Enable-LocalDumps "mini_target.exe"
          Mark-Step "prep:dumps-enabled"

          # x64 sample: calc.exe + x64 shell
          if (Test-Path examples\calc.exe) {
            Copy-Item examples\calc.exe test\samples\x64\calc.exe -Force
          } else {
            Copy-Item bin\x64\MiniTarget.exe test\samples\x64\calc.exe -Force
          }
          if (Test-Path "$env:WINDIR\System32\calc.exe") {
            Copy-Item "$env:WINDIR\System32\calc.exe" test\samples\x64\sys_calc.exe -Force
          }
          Copy-Item bin\x64\MiniTarget.exe test\samples\x64\mini_target.exe -Force
          Copy-Item bin\x64\CombatShellCli.exe test\samples\x64\CombatShellCli.exe -Force
          Copy-Item bin\x64\CombatShell.dll test\samples\x64\CombatShell.dll -Force
          Mark-Step "prep:x64-files-ready"

          # x86 sample: mini_target.exe + x86 shell
          Copy-Item bin\MiniTarget.exe test\samples\x86\mini_target.exe -Force
          Copy-Item bin\CombatShellCli.exe test\samples\x86\CombatShellCli.exe -Force
          $x86ShellDll = Resolve-FirstExistingPath @(
            "bin\CombatShell.dll",
            "bin\Win32\CombatShell.dll",
            "bin\Win32\Release\CombatShell.dll",
            "bin\Release\CombatShell.dll"
          )
          Copy-Item $x86ShellDll test\samples\x86\CombatShell.dll -Force
          Mark-Step "prep:x86-files-ready"
          Copy-Item test\samples\x64\CombatShell.dll dist\packed\x64\CombatShell.dll -Force
          Copy-Item test\samples\x86\CombatShell.dll dist\packed\x86\CombatShell.dll -Force
          Mark-Step "prep:packed-dll-copied"

          function Assert-MonotonicRawOffsets([string]$path) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path).Path)
            $elfanew = [BitConverter]::ToUInt32($bytes, 0x3C)
            $numSec = [BitConverter]::ToUInt16($bytes, $elfanew + 4 + 2)
            $optSize = [BitConverter]::ToUInt16($bytes, $elfanew + 4 + 16)
            $secOff = $elfanew + 4 + 20 + $optSize
            $prevRaw = 0
            for ($i = 0; $i -lt $numSec; $i++) {
              $so = $secOff + $i * 40
              $name = [System.Text.Encoding]::ASCII.GetString($bytes, $so, 8).TrimEnd([char]0)
              $rawSize = [BitConverter]::ToUInt32($bytes, $so + 16)
              $rawPtr  = [BitConverter]::ToUInt32($bytes, $so + 20)
              $chars   = [BitConverter]::ToUInt32($bytes, $so + 36)
              if ($rawSize -gt 0) {
                if ($rawPtr -lt $prevRaw) {
                  throw "PE section [$name] RawPtr=0x$($rawPtr.ToString('X')) < prev=0x$($prevRaw.ToString('X')): non-monotonic raw offsets will cause 0xC000007B on Win10+"
                }
                $prevRaw = $rawPtr
              }
              # Sections with no raw data must use CNT_UNINITIALIZED_DATA (0x80),
              # not CNT_CODE (0x20) or CNT_INITIALIZED_DATA (0x40).
              if ($rawSize -eq 0 -and $rawPtr -eq 0) {
                $cntCode = $chars -band 0x20
                $cntInit = $chars -band 0x40
                $cntUninit = $chars -band 0x80
                if (($cntCode -ne 0 -or $cntInit -ne 0) -and $cntUninit -eq 0) {
                  throw "PE section [$name] has SizeOfRawData=0 but Characteristics=0x$($chars.ToString('X')) still has CNT_CODE/CNT_INITIALIZED_DATA without CNT_UNINITIALIZED_DATA"
                }
              }
              $flagStr = ""
              if ($chars -band 0x20) { $flagStr += "CODE " }
              if ($chars -band 0x40) { $flagStr += "IDATA " }
              if ($chars -band 0x80) { $flagStr += "UDATA " }
              Write-Host "  [$i] $($name.PadRight(8)) VA=0x$([BitConverter]::ToUInt32($bytes,$so+12).ToString('X8')) Raw=0x$($rawPtr.ToString('X8')) RawSz=0x$($rawSize.ToString('X8')) Chars=0x$($chars.ToString('X8')) $flagStr"
            }
            Write-Host "PE section raw offsets: monotonic OK"
            Write-Host "PE section content-type flags: consistent OK"
          }

          Push-Location test\samples\x64
          Mark-Step "x64:inspect-calc:start"
          .\CombatShellCli.exe inspect .\calc.exe
          Mark-Step "x64:calc-baseline:start"
          Assert-LaunchOrCollect ".\calc.exe" "calc_x64_baseline"
          Mark-Step "x64:calc-pack:start"
          .\CombatShellCli.exe pack .\calc.exe
          .\CombatShellCli.exe inspect .\calc.exe
          Assert-MonotonicRawOffsets ".\calc.exe"
          Copy-Item .\calc.exe ..\..\..\dist\packed\x64\calc_x64_packed.exe -Force
          Mark-Step "x64:calc-packed-run:start"
          Assert-LaunchOrCollect ".\calc.exe" "calc_x64_packed"
          if (Test-Path .\CombatShell_trace.log) {
            Copy-Item .\CombatShell_trace.log ..\..\..\dist\diagnostics\calc_x64_packed_trace.log -Force
            Write-Host "--- calc_x64 packed shell trace ---"
            Get-Content .\CombatShell_trace.log
            Write-Host "--- end trace ---"
          }
          Mark-Step "x64:calc-unpack:start"
          .\CombatShellCli.exe unpack .\calc.exe
          .\CombatShellCli.exe inspect .\calc.exe
          Assert-LaunchOrCollect ".\calc.exe" "calc_x64_unpacked"
          Mark-Step "x64:calc-unpack:done"

          if (Test-Path .\sys_calc.exe) {
            try {
              .\CombatShellCli.exe inspect .\sys_calc.exe
              Assert-LaunchOrCollect ".\sys_calc.exe" "sys_calc_x64_baseline"
              .\CombatShellCli.exe pack .\sys_calc.exe
              .\CombatShellCli.exe inspect .\sys_calc.exe
              Copy-Item .\sys_calc.exe ..\..\..\dist\packed\x64\sys_calc_x64_packed.exe -Force
              Assert-LaunchOrCollect ".\sys_calc.exe" "sys_calc_x64_packed"
              .\CombatShellCli.exe unpack .\sys_calc.exe
              .\CombatShellCli.exe inspect .\sys_calc.exe
              Assert-LaunchOrCollect ".\sys_calc.exe" "sys_calc_x64_unpacked"
            } catch {
              Write-Warning "sys_calc validation failed: $($_.Exception.Message)"
            }
          }

          .\CombatShellCli.exe inspect .\mini_target.exe
          Mark-Step "x64:mini-pack:start"
          .\CombatShellCli.exe pack .\mini_target.exe
          .\CombatShellCli.exe inspect .\mini_target.exe
          Assert-MonotonicRawOffsets ".\mini_target.exe"
          Copy-Item .\mini_target.exe ..\..\..\dist\packed\x64\mini_target_x64_packed.exe -Force
          Mark-Step "x64:mini-unpack:start"
          .\CombatShellCli.exe unpack .\mini_target.exe
          .\CombatShellCli.exe inspect .\mini_target.exe
          Mark-Step "x64:mini-unpack:done"
          Pop-Location

          Push-Location test\samples\x86
          Mark-Step "x86:mini-pack:start"
          .\CombatShellCli.exe inspect .\mini_target.exe
          .\CombatShellCli.exe pack .\mini_target.exe
          .\CombatShellCli.exe inspect .\mini_target.exe
          Assert-MonotonicRawOffsets ".\mini_target.exe"
          Copy-Item .\mini_target.exe ..\..\..\dist\packed\x86\mini_target_x86_packed.exe -Force
          Mark-Step "x86:mini-unpack:start"
          .\CombatShellCli.exe unpack .\mini_target.exe
          .\CombatShellCli.exe inspect .\mini_target.exe
          Mark-Step "x86:mini-unpack:done"
          Write-Host "x86 mini_target runtime assertion skipped; see inspect + archived sample for diagnostics."
          Pop-Location

      - name: Execute packed executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path dist\diagnostics | Out-Null
          New-Item -ItemType Directory -Force -Path dist\packed\calc_isolated | Out-Null

          function Enable-LocalDumps([string]$exeName) {
            $dumpDir = (Resolve-Path "dist\diagnostics").Path
            $dumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$exeName"
            New-Item -Path $dumpKey -Force | Out-Null
            New-ItemProperty -Path $dumpKey -Name "DumpFolder" -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
            New-ItemProperty -Path $dumpKey -Name "DumpType" -PropertyType DWord -Value 2 -Force | Out-Null
            New-ItemProperty -Path $dumpKey -Name "DumpCount" -PropertyType DWord -Value 10 -Force | Out-Null
          }

          function Export-CrashEvents([datetime]$startTime, [string]$label) {
            $events = Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = $startTime.AddSeconds(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @("Application Error", "Windows Error Reporting") }
            if ($events) {
              $events |
                Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message |
                Format-List |
                Out-File -FilePath "dist\diagnostics\${label}_events.txt" -Encoding utf8
            }
          }

          function Extract-ShellTraceFromDump([string]$exeName, [string]$label) {
            Start-Sleep -Seconds 1
            $dump = Get-ChildItem -Path dist\diagnostics -Filter "$exeName.*.dmp" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if (-not $dump) { return }
            $bytes = [System.IO.File]::ReadAllBytes($dump.FullName)
            $needle = [System.Text.Encoding]::ASCII.GetBytes("CombatShellEntry:start|")
            $idx = -1
            for ($i = 0; $i -le $bytes.Length - $needle.Length; $i++) {
              $ok = $true
              for ($j = 0; $j -lt $needle.Length; $j++) {
                if ($bytes[$i + $j] -ne $needle[$j]) { $ok = $false; break }
              }
              if ($ok) { $idx = $i; break }
            }
            if ($idx -lt 0) { return }
            $chars = New-Object System.Collections.Generic.List[byte]
            for ($k = $idx; $k -lt [Math]::Min($idx + 32768, $bytes.Length); $k++) {
              if ($bytes[$k] -eq 0) { break }
              $chars.Add($bytes[$k]) | Out-Null
            }
            if ($chars.Count -gt 0) {
              [System.Text.Encoding]::ASCII.GetString($chars.ToArray()) |
                Out-File -FilePath "dist\diagnostics\${label}_shell_trace.txt" -Encoding utf8
            }

            # Fallback: collect multiple known markers to improve x86 dump visibility.
            if (-not (Test-Path "dist\diagnostics\${label}_shell_trace.txt")) {
              $markers = @(
                "CombatShellEntry:start|",
                "ApplyReloc:start|",
                "RepairTheIAT:start|",
                "VmEntry:start|",
                "Crash:veh|",
                "Crash:uef|"
              )
              foreach ($m in $markers) {
                $needle = [System.Text.Encoding]::ASCII.GetBytes($m)
                $idx2 = -1
                for ($i = 0; $i -le $bytes.Length - $needle.Length; $i++) {
                  $ok = $true
                  for ($j = 0; $j -lt $needle.Length; $j++) {
                    if ($bytes[$i + $j] -ne $needle[$j]) { $ok = $false; break }
                  }
                  if ($ok) { $idx2 = $i; break }
                }
                if ($idx2 -ge 0) {
                  $chars2 = New-Object System.Collections.Generic.List[byte]
                  for ($k = $idx2; $k -lt [Math]::Min($idx2 + 32768, $bytes.Length); $k++) {
                    if ($bytes[$k] -eq 0) { break }
                    $chars2.Add($bytes[$k]) | Out-Null
                  }
                  if ($chars2.Count -gt 0) {
                    [System.Text.Encoding]::ASCII.GetString($chars2.ToArray()) |
                      Out-File -FilePath "dist\diagnostics\${label}_shell_trace.txt" -Encoding utf8
                    break
                  }
                }
              }
            }
          }

          function Analyze-Dump([string]$exeName, [string]$label) {
            $dump = Get-ChildItem -Path dist\diagnostics -Filter "$exeName.*.dmp" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if (-not $dump) { return }
            $cdbCandidates = @(
              "$env:ProgramFiles(x86)\Windows Kits\10\Debuggers\x64\cdb.exe",
              "$env:ProgramFiles(x86)\Windows Kits\10\Debuggers\x86\cdb.exe"
            )
            $cdbCandidates |
              ForEach-Object { "{0}`t{1}" -f $_, (Test-Path $_) } |
              Out-File -FilePath "dist\diagnostics\${label}_cdb_candidates.txt" -Encoding utf8
            $cdb = $cdbCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $cdb) {
              $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits"
              if (Test-Path $kitsRoot) {
                Get-ChildItem -Path $kitsRoot -Filter cdb.exe -Recurse -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName |
                  Out-File -FilePath "dist\diagnostics\${label}_cdb_search.txt" -Encoding utf8
              }
              return
            }
            & $cdb -z $dump.FullName -c "!analyze -v; .ecxr; kv; q" |
              Out-File -FilePath "dist\diagnostics\${label}_dump_analyze.txt" -Encoding utf8
          }

          function Assert-LaunchOrCollect([string]$path, [string]$label, [string]$exeName) {
            $start = Get-Date
            try {
              $proc = Start-Process -FilePath $path -PassThru
            } catch {
              Export-CrashEvents -startTime $start -label $label
              Extract-ShellTraceFromDump -exeName $exeName -label $label
              Analyze-Dump -exeName $exeName -label $label
              throw
            }
            Start-Sleep -Seconds 3
            if ($proc.HasExited) {
              if ($proc.ExitCode -ne 0) {
                Export-CrashEvents -startTime $start -label $label
                Extract-ShellTraceFromDump -exeName $exeName -label $label
                Analyze-Dump -exeName $exeName -label $label
                throw "process exited with non-zero code: $path (exit=$($proc.ExitCode))"
              }
              return
            }
            Stop-Process -Id $proc.Id -Force
          }

          Enable-LocalDumps "calc_x64_packed.exe"
          Enable-LocalDumps "sys_calc_x64_packed.exe"
          Enable-LocalDumps "mini_target_x64_packed.exe"
          Enable-LocalDumps "mini_target_x86_packed.exe"

          Copy-Item .\dist\packed\x64\calc_x64_packed.exe .\dist\packed\calc_isolated\calc_x64_packed.exe -Force
          Assert-LaunchOrCollect ".\dist\packed\calc_isolated\calc_x64_packed.exe" "calc_x64_packed_isolated" "calc_x64_packed.exe"
          # Collect trace files from wherever the packed binary ran
          foreach ($traceDir in @(".\dist\packed\calc_isolated", ".\dist\packed\x64", ".\dist\packed\x86")) {
            $traceFile = Join-Path $traceDir "CombatShell_trace.log"
            if (Test-Path $traceFile) {
              $label = ($traceDir -replace '[\\./]', '_').Trim('_')
              Copy-Item $traceFile ".\dist\diagnostics\${label}_shell_trace.log" -Force
              Write-Host "--- shell trace from $traceDir ---"
              Get-Content $traceFile
              Write-Host "--- end trace ---"
            }
          }
          Assert-LaunchOrCollect ".\dist\packed\x64\calc_x64_packed.exe" "calc_x64_packed" "calc_x64_packed.exe"
          if (Test-Path .\dist\packed\x64\sys_calc_x64_packed.exe) {
            Assert-LaunchOrCollect ".\dist\packed\x64\sys_calc_x64_packed.exe" "sys_calc_x64_packed" "sys_calc_x64_packed.exe"
          }

          Assert-LaunchOrCollect ".\dist\packed\x64\mini_target_x64_packed.exe" "mini_target_x64_packed" "mini_target_x64_packed.exe"
          Assert-LaunchOrCollect ".\dist\packed\x86\mini_target_x86_packed.exe" "mini_target_x86_packed" "mini_target_x86_packed.exe"

      - name: Upload test samples artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-pack-test
          path: test\samples\*
          if-no-files-found: error

      - name: Upload packed calc artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-calc-x64
          path: dist\packed\x64\calc_x64_packed.exe
          if-no-files-found: error

      - name: Upload packed sys calc artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-sys-calc-x64
          path: dist\packed\x64\sys_calc_x64_packed.exe
          if-no-files-found: ignore

      - name: Upload packed mini x64 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-mini-target-x64
          path: dist\packed\x64\mini_target_x64_packed.exe
          if-no-files-found: error

      - name: Upload packed mini x86 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-mini-target-x86
          path: dist\packed\x86\mini_target_x86_packed.exe
          if-no-files-found: error

      - name: Upload crash diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-crash-diagnostics
          path: dist\diagnostics\*
          if-no-files-found: ignore

  forensic-x86:
    name: Forensic x86 diagnostics
    runs-on: windows-2022
    needs: test-example-pack
    if: ${{ always() && needs.test-example-pack.result == 'failure' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Win32 binaries with diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & msbuild .\CombatShell\CombatShell.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:ShellDiagnostics=true
          if ($LASTEXITCODE -ne 0) { throw "build CombatShell Win32 failed" }
          & msbuild .\CombatShellCli.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { throw "build CombatShellCli Win32 failed" }
          & msbuild .\examples\MiniTarget.vcxproj /m /p:Configuration=Release /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { throw "build MiniTarget Win32 failed" }

      - name: Reproduce x86 packed runtime crash with deep diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist\forensic | Out-Null
          New-Item -ItemType Directory -Force -Path dist\forensic\sample | Out-Null

          function Enable-LocalDumps([string]$exeName) {
            $dumpDir = (Resolve-Path "dist\forensic").Path
            $dumpKey = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\$exeName"
            New-Item -Path $dumpKey -Force | Out-Null
            New-ItemProperty -Path $dumpKey -Name "DumpFolder" -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
            New-ItemProperty -Path $dumpKey -Name "DumpType" -PropertyType DWord -Value 2 -Force | Out-Null
            New-ItemProperty -Path $dumpKey -Name "DumpCount" -PropertyType DWord -Value 10 -Force | Out-Null
          }

          function Analyze-Dump([string]$exeName) {
            $dump = Get-ChildItem -Path dist\forensic -Filter "$exeName.*.dmp" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if (-not $dump) { return }
            $cdbCandidates = @(
              "$env:ProgramFiles(x86)\Windows Kits\10\Debuggers\x64\cdb.exe",
              "$env:ProgramFiles(x86)\Windows Kits\10\Debuggers\x86\cdb.exe"
            )
            $cdbCandidates |
              ForEach-Object { "{0}`t{1}" -f $_, (Test-Path $_) } |
              Out-File -FilePath "dist\forensic\cdb_candidates.txt" -Encoding utf8
            $cdb = $cdbCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $cdb) { return }
            & $cdb -z $dump.FullName -c "!analyze -v; .ecxr; r; kv; q" |
              Out-File -FilePath "dist\forensic\dump_analyze.txt" -Encoding utf8
          }

          function Extract-ShellTrace([string]$exeName) {
            $dump = Get-ChildItem -Path dist\forensic -Filter "$exeName.*.dmp" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if (-not $dump) { return }
            $bytes = [System.IO.File]::ReadAllBytes($dump.FullName)
            $markers = @(
              "CombatShellEntry:start|",
              "ApplyReloc:start|",
              "RepairTheIAT:start|",
              "Crash:uef|",
              "Crash:veh|"
            )
            foreach ($m in $markers) {
              $needle = [System.Text.Encoding]::ASCII.GetBytes($m)
              $idx = -1
              for ($i = 0; $i -le $bytes.Length - $needle.Length; $i++) {
                $ok = $true
                for ($j = 0; $j -lt $needle.Length; $j++) {
                  if ($bytes[$i + $j] -ne $needle[$j]) { $ok = $false; break }
                }
                if ($ok) { $idx = $i; break }
              }
              if ($idx -ge 0) {
                $chars = New-Object System.Collections.Generic.List[byte]
                for ($k = $idx; $k -lt [Math]::Min($idx + 65536, $bytes.Length); $k++) {
                  if ($bytes[$k] -eq 0) { break }
                  $chars.Add($bytes[$k]) | Out-Null
                }
                if ($chars.Count -gt 0) {
                  [System.Text.Encoding]::ASCII.GetString($chars.ToArray()) |
                    Out-File -FilePath "dist\forensic\shell_trace.txt" -Encoding utf8
                  break
                }
              }
            }
          }

          Enable-LocalDumps "mini_target_x86_forensic.exe"
          Copy-Item bin\MiniTarget.exe dist\forensic\sample\mini_target.exe -Force
          Copy-Item bin\CombatShellCli.exe dist\forensic\sample\CombatShellCli.exe -Force
          Copy-Item bin\CombatShell.dll dist\forensic\sample\CombatShell.dll -Force

          Push-Location dist\forensic\sample
          .\CombatShellCli.exe inspect .\mini_target.exe | Out-File -FilePath ..\inspect_before.txt -Encoding utf8
          .\CombatShellCli.exe pack .\mini_target.exe
          .\CombatShellCli.exe inspect .\mini_target.exe | Out-File -FilePath ..\inspect_after_pack.txt -Encoding utf8
          Copy-Item .\mini_target.exe .\mini_target_x86_forensic.exe -Force
          Pop-Location

          $start = Get-Date
          $proc = Start-Process -FilePath .\dist\forensic\sample\mini_target_x86_forensic.exe -PassThru -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 4
          if ($proc -and -not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            "forensic launch still running (no immediate crash)" | Out-File -FilePath dist\forensic\result.txt -Encoding utf8
          } else {
            $exitCode = if ($proc) { $proc.ExitCode } else { -1 }
            "forensic launch failed or exited quickly, exit=$exitCode" | Out-File -FilePath dist\forensic\result.txt -Encoding utf8
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; StartTime = $start.AddSeconds(-5) } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @("Application Error", "Windows Error Reporting") } |
              Select-Object TimeCreated, ProviderName, Id, Message |
              Format-List |
              Out-File -FilePath dist\forensic\events.txt -Encoding utf8
            Extract-ShellTrace -exeName "mini_target_x86_forensic.exe"
            Analyze-Dump -exeName "mini_target_x86_forensic.exe"
          }

      - name: Upload forensic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-x86-forensic
          path: dist\forensic\*
          if-no-files-found: ignore
